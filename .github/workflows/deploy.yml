name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Patch API route for static export
        run: |
          sed -i "2a export const dynamic = 'force-static';" app/api/aladin/route.ts

      - name: Build
        run: npm run build
        env:
          NEXT_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /yourBook

      # ─────────────────────────────────────────────────────────────
      # Jekyll은 _ 로 시작하는 폴더를 무시한다 → _next/ 가 통째로 사라짐
      # → CSS/JS 404 → 흰 화면 문제
      # 해결: _next/ 를 next_static/ 으로 이름 변경 후 참조 전체 교체
      # ─────────────────────────────────────────────────────────────
      - name: Rename _next → next_static (fix Jekyll _ exclusion)
        run: |
          cd out

          # 디렉터리 이름 변경
          mv _next next_static
          mv _not-found not-found 2>/dev/null || true

          # HTML / JS / CSS / JSON 내 모든 경로 참조 교체
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" -o -name "*.txt" \) \
            -exec sed -i \
              -e 's|/yourBook/_next/|/yourBook/next_static/|g' \
              -e 's|"/_next/|"/next_static/|g' \
              -e 's|'"'"'/_next/'"'"'|'"'"'/next_static/'"'"'|g' \
              -e 's|/_not-found/|/not-found/|g' \
            {} \;

          cd ..

      - name: Deploy to root
        run: |
          git rm -rf docs/     2>/dev/null || true
          git rm -rf _next/    2>/dev/null || true
          git rm -rf next_static/ 2>/dev/null || true

          cp -r out/. .
          touch .nojekyll

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f .nojekyll
          for item in $(ls out/); do
            git add -f "$item" 2>/dev/null || true
          done

          git diff --staged --quiet || git commit -m "chore: deploy [skip ci]"
          git push
