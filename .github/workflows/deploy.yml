name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 배포 커밋이 다시 워크플로를 트리거하지 않도록
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Patch API route for static export
        run: |
          sed -i "2a export const dynamic = 'force-static';" app/api/aladin/route.ts

      - name: Build
        run: npm run build
        env:
          NEXT_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /yourBook

      - name: Deploy to root
        run: |
          # 이전 docs/ 방식 잔재 제거
          git rm -rf docs/ 2>/dev/null || true

          # 빌드 결과물을 레포 루트에 복사
          cp -r out/. .

          # Jekyll 처리 방지 (Next.js 에셋이 깨지지 않도록)
          touch .nojekyll

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f .nojekyll
          for item in $(ls out/); do
            git add -f "$item" 2>/dev/null || true
          done

          git diff --staged --quiet || git commit -m "chore: deploy [skip ci]"
          git push
