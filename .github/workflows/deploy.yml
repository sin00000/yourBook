name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Patch API route for static export
        run: |
          sed -i "2a export const dynamic = 'force-static';" app/api/aladin/route.ts

      - name: Build
        run: npm run build
        env:
          NEXT_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /yourBook

      # Jekyll은 _ 로 시작하는 폴더를 무시 → _next/ 404
      # next_static/ 으로 이름 변경 후 HTML/JS 내 참조 전체 교체
      - name: Rename _next → next_static
        run: |
          cd out
          mv _next next_static
          mv _not-found not-found 2>/dev/null || true
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" -o -name "*.txt" \) \
            -exec sed -i \
              -e 's|/yourBook/_next/|/yourBook/next_static/|g' \
              -e 's|"/_next/|"/next_static/|g' \
              -e "s|'/_next/|'/next_static/|g" \
              -e 's|/_not-found/|/not-found/|g' \
            {} \;
          cd ..

      # gh-pages 브랜치에 배포 (.nojekyll 자동 추가)
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
